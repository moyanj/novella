[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
logos = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
novella-core = { path = "crates/novella-core" }
novella-lexer = { path = "crates/novella-lexer" }
novella-parser = { path = "crates/novella-parser" }
novella-sema = { path = "crates/novella-sema" }
novella-codegen = { path = "crates/novella-codegen" }

[profile.release]
lto = true
