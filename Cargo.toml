[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
novella-core = { path = "crates/novella-core", version = "0.1.0" }
novella-lexer = { path = "crates/novella-lexer", version = "0.1.0" }
novella-parser = { path = "crates/novella-parser", version = "0.1.0" }
novella-sema = { path = "crates/novella-sema", version = "0.1.0" }
novella-codegen = { path = "crates/novella-codegen", version = "0.1.0" }

[profile.release]
lto = true