[package]
name = "novella-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inkwell = { version = "0.11.0", default-features = false, features = ["llvm23-1-prefer-dynamic", "target-x86"] }
novella-core = { version = "0.1.0", path = "../novella-core" }
novella-hir = { version = "0.1.0", path = "../novella-hir" }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }
